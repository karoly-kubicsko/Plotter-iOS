name: Build Plotter

# Two jobs. "ui-tests" drives the app with real touches on an iPhone and an iPad simulator
# (UITests/). "simulator" runs the math tests, builds the app with swiftc (build.sh), installs it in
# an iPhone and an iPad simulator, launches it in the 2D and the 3D view and takes screenshots.
# Nothing here needs an Apple Developer account: simulator builds are not signed for a device.
# Does not publish a release.

on:
  push:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Icon/**"
      - "Tests/**"
      - "UITests/**"
      - "project.yml"
      - "build.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  # Real touches (drag, pinch, tap, double tap) on an iPhone and an iPad simulator, with XCUITest.
  # The tests need an Xcode project; it is generated from project.yml and not committed.
  ui-tests:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run the touch-control UI tests on an ${{ matrix.family }} simulator
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -o pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["platform"] == "iOS"]
          rts.sort(key=lambda r: [int(p) for p in r["version"].split(".")])
          print(rts[-1]["identifier"])')
          UDID=$(xcrun simctl list devices available -j | RUNTIME="$RUNTIME" python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"][os.environ["RUNTIME"]]
          print(next(d["udid"] for d in devices if d["name"].startswith(os.environ["FAMILY"])))')
          echo "$FAMILY simulator $UDID ($RUNTIME)"
          mkdir -p build
          xcodebuild test \
            -project Plotter.xcodeproj -scheme Plotter \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath "build/UITests-$FAMILY.xcresult" \
            2>&1 | tee "build/xcodebuild-$FAMILY.log" \
            | grep -E "Test Case|Test Suite 'TouchControlsTests'|error:|XCTAssert|failed|\*\* TEST"

      - name: Details of any failure
        if: failure()
        run: |
          grep -E "error:|failed|XCTAssert" "build/xcodebuild-$FAMILY.log" | head -60 || true
          tail -60 "build/xcodebuild-$FAMILY.log" || true
        env:
          FAMILY: ${{ matrix.family }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UITests-${{ matrix.family }}
          path: build/UITests-${{ matrix.family }}.xcresult
          if-no-files-found: ignore

  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write   # the last step commits the screenshots to the branch
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swiftc --version
          echo "iOS Simulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list runtimes

      # Runs the math-engine tests, then builds the app.
      - name: Test and build Plotter.app for the iOS Simulator
        run: ./build.sh --test

      - name: Inspect bundle
        run: |
          find build/Plotter.app -print | sed 's|^build/||'
          plutil -p build/Plotter.app/Info.plist

      # Boots a simulator of each device family, installs the app, launches it in the 2D
      # view and takes a screenshot; the app has to still be running after a few seconds.
      - name: Run in the simulator and take screenshots
        run: |
          mkdir -p build/shots
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["platform"] == "iOS"]
          rts.sort(key=lambda r: [int(p) for p in r["version"].split(".")])
          print(rts[-1]["identifier"])')
          echo "runtime: $RUNTIME"
          for family in iPhone iPad; do
            UDID=$(xcrun simctl list devices available -j | RUNTIME="$RUNTIME" FAMILY="$family" python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"][os.environ["RUNTIME"]]
          print(next(d["udid"] for d in devices if d["name"].startswith(os.environ["FAMILY"])))')
            echo "=== $family $UDID ==="
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" build/Plotter.app
            # once in the 2D and once in the 3D view
            for mode in curve surface; do
              name="$family-$([[ $mode == curve ]] && echo 2D || echo 3D)"
              ID=io.github.karoly-kubicsko.plotter-ios
              running() {  # prints the app's PID in the simulator, if it has one
                xcrun simctl spawn "$UDID" launchctl list | awk -v id="UIKitApplication:$ID" 'index($3, id) == 1 && $1 ~ /^[0-9]+$/ {print $1; exit}'
              }
              # Right after a boot (an iPad's first boot takes minutes) a launch can be lost:
              # wait up to 30 s for the process, and launch once more if it did not come.
              PID=""
              for attempt in 1 2; do
                xcrun simctl launch --console-pty "$UDID" "$ID" -PlotterStartMode "$mode" \
                  > "build/shots/log-$name.txt" 2>&1 &
                LAUNCH=$!
                for _ in $(seq 1 15); do
                  sleep 2
                  PID=$(running)
                  [[ -n "$PID" ]] && break
                done
                [[ -n "$PID" ]] && break
                echo "launch $attempt of the $name run: the app did not start"
                cat "build/shots/log-$name.txt"
                kill "$LAUNCH" 2>/dev/null || true
              done
              sleep 10   # let it draw
              xcrun simctl io "$UDID" screenshot "build/shots/$name.png"
              ls -l "build/shots/$name.png"
              PID=$(running)
              echo "app PID in the $name run: ${PID:-none}"
              if [[ -z "$PID" ]]; then
                echo "the app is not running; launch output:"
                cat "build/shots/log-$name.txt"
                echo "crash reports:"
                ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i plotter | head -5 || true
                for report in $(ls -t ~/Library/Logs/DiagnosticReports/*lotter*.ips 2>/dev/null | head -1); do head -c 6000 "$report"; done
                exit 1
              fi
              xcrun simctl terminate "$UDID" "$ID" || true
              wait || true
              echo "--- app output ($name) ---"
              cat "build/shots/log-$name.txt"
            done
            xcrun simctl shutdown "$UDID"
          done

      - name: Package
        run: ditto -c -k --keepParent build/Plotter.app build/Plotter-iOS-Simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Plotter-iOS-Simulator
          path: build/Plotter-iOS-Simulator.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Plotter-iOS-screenshots
          path: build/shots/*.png
          if-no-files-found: ignore

      # Commits the newest screenshots to docs/ios-screenshots/ on the branch that was built
      # (the same two files every time), so they can be looked at in the repository without
      # downloading the artifact. A push made with the workflow token starts no new run.
      # Not done on main.
      - name: Commit the screenshots to the branch
        if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          set -e
          mkdir -p docs/ios-screenshots
          rm -f docs/ios-screenshots/*.png
          cp build/shots/*.png docs/ios-screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ios-screenshots
          if git diff --cached --quiet; then echo "screenshots unchanged"; exit 0; fi
          git commit --quiet -m "iOS simulator screenshots of ${GITHUB_SHA::7} (run $GITHUB_RUN_ID)"
          git pull --quiet --rebase origin "$GITHUB_REF_NAME"
          git push --quiet origin "HEAD:$GITHUB_REF_NAME"
          ls -l docs/ios-screenshots
