name: Build Plotter

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write   # the release step below
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcrun swiftc --version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      # Runs the math-engine tests, then builds the app; warnings are errors.
      - name: Test and build Plotter.app
        env:
          STRICT: "1"
        run: ./build.sh --test

      - name: Inspect bundle
        run: |
          find build/Plotter.app -print | sed 's|^build/||'
          plutil -p build/Plotter.app/Contents/Info.plist
          codesign --display --verbose=2 build/Plotter.app 2>&1

      # Launches the app once in the 2D and once in the 3D view, checks that it
      # keeps running, and takes a screenshot of its window each time.
      - name: Smoke test and screenshots
        run: |
          mkdir -p build/shots
          for mode in curve surface; do
            PLOTTER_WINDOW_ID_FILE="$PWD/build/shots/window-$mode.txt" \
              build/Plotter.app/Contents/MacOS/Plotter -PlotterStartMode "$mode" \
              > "build/shots/log-$mode.txt" 2>&1 &
            pid=$!
            sleep 8
            kill -0 "$pid"
            if [[ -s "build/shots/window-$mode.txt" ]]; then
              screencapture -x -o -l "$(cat "build/shots/window-$mode.txt")" "build/shots/$mode.png" \
                || screencapture -x "build/shots/$mode.png"
            else
              screencapture -x "build/shots/$mode.png"
            fi
            kill "$pid"
            wait "$pid" || true
            echo "--- app output ($mode) ---"
            cat "build/shots/log-$mode.txt"
          done

      # ditto keeps the executable bit and code signature intact inside the zip.
      - name: Package
        run: ditto -c -k --keepParent build/Plotter.app build/Plotter.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Plotter-macOS
          path: build/Plotter.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Plotter-screenshots
          path: build/shots/*.png
          if-no-files-found: ignore

      # Small JPEG copies of the screenshots, base64-encoded into the log, so
      # they can be inspected without downloading the artifact.
      - name: Print screenshots
        run: |
          for f in build/shots/*.png; do
            [[ -f "$f" ]] || continue
            sips -s format jpeg -s formatOptions 60 -Z 1000 "$f" --out "${f%.png}.jpg" > /dev/null
            echo "=== BEGIN $(basename "${f%.png}").jpg ==="
            base64 -i "${f%.png}.jpg" | fold -w 4000
            echo "=== END ==="
          done

      # Every build of main is published as the GitHub Release of its version: tag
      # v<version>, asset Plotter-<version>.zip. A later build of the same version replaces
      # the app and moves the tag to its commit. Other branches only build.
      - name: Publish as a GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INFO=build/Plotter.app/Contents/Info.plist
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$INFO")
          MINOS=$(plutil -extract LSMinimumSystemVersion raw "$INFO")
          test -n "$VERSION"
          TAG="v$VERSION"
          ASSET="build/Plotter-$VERSION.zip"
          cp build/Plotter.zip "$ASSET"
          TITLE="Plotter $VERSION"
          NOTES="Plotter $VERSION for macOS $MINOS and later (Apple Silicon and Intel), built from $GITHUB_SHA by run $GITHUB_RUN_ID. Unzip Plotter-$VERSION.zip to get Plotter.app. It is ad-hoc signed, not notarised: the first time, open it and choose System Settings > Privacy & Security > Open Anyway, or run xattr -dr com.apple.quarantine Plotter.app. What is new: README, section Versions."
          # create the release, or (it exists: an earlier build of this version, possibly
          # made by releases.yml a moment ago) move its tag here and replace the app
          if gh release view "$TAG" > /dev/null 2>&1 \
             || ! gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          fi
          echo "Release: $(gh release view "$TAG" --json url --jq .url)"
