name: Build Plotter for iOS

# Builds the iOS Simulator app with swiftc (build-ios.sh), installs it in an iPhone and an
# iPad simulator, launches it and takes screenshots. Nothing here needs an Apple Developer
# account: simulator builds are not signed for a device. Does not publish a release.

on:
  push:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Icon/**"
      - "build-ios.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    permissions:
      contents: write   # the last step commits the screenshots to the branch
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swiftc --version
          echo "iOS Simulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list runtimes

      - name: Build Plotter.app for the iOS Simulator
        run: ./build-ios.sh

      - name: Inspect bundle
        run: |
          find build/ios/Plotter.app -print | sed 's|^build/ios/||'
          plutil -p build/ios/Plotter.app/Info.plist

      # Boots a simulator of each device family, installs the app, launches it in the 2D
      # view and takes a screenshot; the app has to still be running after a few seconds.
      - name: Run in the simulator and take screenshots
        run: |
          mkdir -p build/ios/shots
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["platform"] == "iOS"]
          rts.sort(key=lambda r: [int(p) for p in r["version"].split(".")])
          print(rts[-1]["identifier"])')
          echo "runtime: $RUNTIME"
          for family in iPhone iPad; do
            UDID=$(xcrun simctl list devices available -j | RUNTIME="$RUNTIME" FAMILY="$family" python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"][os.environ["RUNTIME"]]
          print(next(d["udid"] for d in devices if d["name"].startswith(os.environ["FAMILY"])))')
            echo "=== $family $UDID ==="
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" build/ios/Plotter.app
            # once in the 2D and once in the 3D view
            for mode in curve surface; do
              name="$family-$([[ $mode == curve ]] && echo 2D || echo 3D)"
              xcrun simctl launch --console-pty "$UDID" io.github.karoly-kubicsko.plotter -PlotterStartMode "$mode" \
                > "build/ios/shots/log-$name.txt" 2>&1 &
              sleep 20
              xcrun simctl io "$UDID" screenshot "build/ios/shots/$name.png"
              # still running? launchctl lists exited jobs too (PID "-"), so require a numeric PID
              PID=$(xcrun simctl spawn "$UDID" launchctl list | awk '/UIKitApplication:io.github.karoly-kubicsko.plotter/ {print $1; exit}')
              echo "app PID in the $name run: ${PID:-none}"
              [[ "$PID" =~ ^[0-9]+$ ]] || { echo "the app is not running"; xcrun simctl spawn "$UDID" launchctl list | tail -20; exit 1; }
              ls -l "build/ios/shots/$name.png"
              xcrun simctl terminate "$UDID" io.github.karoly-kubicsko.plotter || true
              wait || true
              echo "--- app output ($name) ---"
              cat "build/ios/shots/log-$name.txt"
            done
            xcrun simctl shutdown "$UDID"
          done

      - name: Package
        run: ditto -c -k --keepParent build/ios/Plotter.app build/ios/Plotter-iOS-Simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Plotter-iOS-Simulator
          path: build/ios/Plotter-iOS-Simulator.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Plotter-iOS-screenshots
          path: build/ios/shots/*.png
          if-no-files-found: ignore

      # Commits the newest screenshots to docs/ios-screenshots/ on the branch that was built
      # (the same two files every time), so they can be looked at in the repository without
      # downloading the artifact. A push made with the workflow token starts no new run.
      # Not done on main.
      - name: Commit the screenshots to the branch
        if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          set -e
          mkdir -p docs/ios-screenshots
          rm -f docs/ios-screenshots/*.png
          cp build/ios/shots/*.png docs/ios-screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ios-screenshots
          if git diff --cached --quiet; then echo "screenshots unchanged"; exit 0; fi
          git commit --quiet -m "iOS simulator screenshots of ${GITHUB_SHA::7} (run $GITHUB_RUN_ID)"
          git pull --quiet --rebase origin "$GITHUB_REF_NAME"
          git push --quiet origin "HEAD:$GITHUB_REF_NAME"
          ls -l docs/ios-screenshots
